<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">
        <title>Калькулятор онлайн</title>
        <link rel="shortcut icon" href="images/ICON.png">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
       <div class="calc">
       <div class="calc-screen">
        <p>0</p>
       </div>
        <div class="buttons">
            <button class="btn C">C</button>
            <button class="btn levo">(</button>
            <button class="btn pravo">)</button>
            <button class="btn del">del</button>
        </div>

        <div class="buttons">
            <button class="btn 7">7</button>
            <button class="btn 8">8</button>
            <button class="btn 9">9</button>
            <button class="btn umnozh">*</button>
        </div>

        <div class="buttons">
            <button class="btn 4">4</button>
            <button class="btn 5">5</button>
            <button class="btn 6">6</button>
            <button class="btn minus">-</button>
        </div>

        <div class="buttons">
            <button class="btn 1">1</button>
            <button class="btn 2">2</button>
            <button class="btn 3">3</button>
            <button class="btn plus">+</button>
        </div>

        <div class="buttons">
            <button class="btn div">/</button>
            <button class="btn 0">0</button>
            <button class="btn point">,</button>
            <button class="btn ravno">=</button>
        </div>

       </div>
    </body>
</html>
